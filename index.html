<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="POS-CAN: punto de venta gratis para tiendas de barrio. Inventario, fiados, caja y ganancias.">
  <title>POS-CAN</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">POS</span>-CAN</div>
    <div class="topbar-info">
      <span id="store-name"></span>
      <span id="cash-status" class="pill"></span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Secciones">
    <button data-tab="venta" class="active"><span>🛒</span>Vender</button>
    <button data-tab="inventario"><span>📦</span>Inventario</button>
    <button data-tab="fiados"><span>📒</span>Fiados</button>
    <button data-tab="caja"><span>💵</span>Caja</button>
    <button data-tab="reportes"><span>📈</span>Ganancias</button>
    <button data-tab="ajustes"><span>⚙️</span>Ajustes</button>
  </nav>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
